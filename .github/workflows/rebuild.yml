name: Rebuild and deploy

# Mondays (and on demand): download the latest Noto fonts and the other open fonts,
# rebuild site/, commit it if anything changed, and publish site/ to GitHub Pages.
# A push to main that touches site/ only publishes, without rebuilding.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write    # commit the rebuilt site
  pages: write       # deploy to Pages
  id-token: write    # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      REBUILD: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.REBUILD == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: env.REBUILD == 'true'
        run: pip install -r requirements.txt

      - name: Fetch Noto fonts
        if: env.REBUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_noto.py

      - name: Fetch other open fonts
        if: env.REBUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_others.py

      - name: Build
        if: env.REBUILD == 'true'
        run: python scripts/build.py

      - name: Summary
        if: env.REBUILD == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("site/data.json"))
          print(f"**{d['total_missing']:,}** missing characters in {len(d['blocks'])} blocks, data built {d['built']}\n")
          for o in d["others"].values():
              print(f"- {o['name']} {o.get('version', '')} ({o.get('release', '')})")
          PY

      - name: Commit changes
        if: env.REBUILD == 'true'
        run: |
          git add -A site data/raw
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Weekly rebuild: $(python -c 'import json;print(json.load(open("site/data.json"))["built"])')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deploy
        uses: actions/deploy-pages@v4
